[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starfishbot"
version = "0.1.0"
description = "Reproducible CoppeliaSim experiments for a reconfigurable legged robot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "StarfishBot contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "coppeliasim-zmqremoteapi-client>=2.0.4",
  "shapely>=2.0",
]

[project.optional-dependencies]
analysis = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
starfishbot-run = "starfishbot.cli:main"

[project.urls]
Repository = "https://github.com/Leung555/StarfishBot"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "notebooks/*.ipynb",
  "scripts/visualization_examples/*.py",
  "asymmetry_leg_config/GaitPlanner.py",
  "asymmetry_leg_config/neural_control.py",
  "asymmetry_leg_config/controller.py",
  "asymmetry_leg_config/angle_change_experiment.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
