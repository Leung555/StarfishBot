[experiment]
name = "random-leg-angles"
mode = "random_configurations"
seed = 20260115
samples = 100
steps_per_sample = 300
angle_min_deg = 0.0
angle_max_deg = 360.0
minimum_angle_separation_deg = 25.0

[robot]
num_legs = 6
joints_per_leg = 3
joint_bias_rad = [0.0, -0.52, 2.09]
lift_offsets_rad = [0.0, -0.8, 0.0]
default_angles_deg = [0.0, 60.0, 120.0, 180.0, 240.0, 300.0]
leg_radius = 1.0
robot_path = "/hexapod"
leg_mount_joint_pattern = ":/Revolute_joint[{leg}]"
actuator_joint_pattern = ":/joint{joint}_{leg}"

[gait]
max_legs_lifted = 1
lifting_period_steps = 40
fast_lifting_period_steps = 4
stance_transition_steps = 20
stability_threshold = 0.2

[motor]
# "binary" reproduces the fixed joint offset in the original experiment.
# "cpg" applies a documented oscillator-scaled lift offset instead.
mode = "binary"
cpg_mi = 0.0

[simulator]
scene = "scenes/Asymmetry_Leg_gait.ttt"

[output]
directory = "results"
